<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon – GEOG 5150/6150</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f0eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1c1a17;
        }
        .card {
            background: #ffffff;
            border: 1px solid #d6cec4;
            padding: 52px 64px;
            text-align: center;
            max-width: 460px;
            width: 90%;
        }
        .dog-wrap {
            margin-bottom: 28px;
            position: relative;
            height: 110px;
            overflow: hidden;
        }
        .dog {
            position: absolute;
            bottom: 10px;
            animation: walk 3s linear infinite;
        }
        @keyframes walk {
            0%   { left: -80px; }
            100% { left: 110%; }
        }
        /* paw prints */
        .paw {
            position: absolute;
            bottom: 4px;
            font-size: 13px;
            opacity: 0;
            animation: paw-appear 3s linear infinite;
        }
        .paw:nth-child(1) { left: 15%; animation-delay: 0.4s; }
        .paw:nth-child(2) { left: 28%; animation-delay: 0.9s; }
        .paw:nth-child(3) { left: 41%; animation-delay: 1.4s; }
        .paw:nth-child(4) { left: 54%; animation-delay: 1.9s; }
        .paw:nth-child(5) { left: 67%; animation-delay: 2.4s; }
        @keyframes paw-appear {
            0%   { opacity: 0; }
            30%  { opacity: 0; }
            40%  { opacity: 0.5; }
            80%  { opacity: 0.5; }
            100% { opacity: 0; }
        }
        /* ground line */
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: #d6cec4;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 300;
            color: #1c1a17;
            margin-bottom: 10px;
        }
        p {
            font-size: 13px;
            font-weight: 300;
            color: #8c857d;
            line-height: 1.7;
            margin-bottom: 28px;
        }
        a {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #4a4540;
            border-bottom: 1px solid #d6cec4;
            padding-bottom: 2px;
            text-decoration: none;
        }
        a:hover { color: #1c1a17; border-color: #1c1a17; }
    </style>
</head>
<body>
    <div class="card">

        <div class="dog-wrap">

            <!-- paw prints on the ground -->
            <span class="paw">🐾</span>
            <span class="paw">🐾</span>
            <span class="paw">🐾</span>
            <span class="paw">🐾</span>
            <span class="paw">🐾</span>

            <!-- Walking dog SVG -->
            <svg class="dog" width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- tail -->
                <path d="M10 32 Q4 24 8 18" stroke="#8c857d" stroke-width="3" stroke-linecap="round" fill="none">
                    <animateTransform attributeName="transform" type="rotate" values="0 10 32; 12 10 32; 0 10 32" dur="0.5s" repeatCount="indefinite"/>
                </path>
                <!-- body -->
                <ellipse cx="32" cy="36" rx="20" ry="13" fill="#d6cec4" stroke="#8c857d" stroke-width="1.5"/>
                <!-- neck -->
                <path d="M46 28 Q52 20 50 14" stroke="#d6cec4" stroke-width="8" stroke-linecap="round" fill="none"/>
                <path d="M46 28 Q52 20 50 14" stroke="#8c857d" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <!-- head -->
                <circle cx="52" cy="12" r="9" fill="#d6cec4" stroke="#8c857d" stroke-width="1.5"/>
                <!-- ear -->
                <ellipse cx="46" cy="8" rx="4" ry="6" fill="#c4bbb0" stroke="#8c857d" stroke-width="1" transform="rotate(-20 46 8)">
                    <animateTransform attributeName="transform" type="rotate" values="-20 46 8; -30 46 8; -20 46 8" dur="0.5s" repeatCount="indefinite"/>
                </ellipse>
                <!-- eye -->
                <circle cx="55" cy="10" r="1.5" fill="#4a4540"/>
                <!-- nose -->
                <ellipse cx="59" cy="14" rx="2" ry="1.2" fill="#4a4540"/>
                <!-- mouth -->
                <path d="M59 15 Q61 17 59 17" stroke="#4a4540" stroke-width="1" stroke-linecap="round" fill="none"/>
                <!-- tongue -->
                <ellipse cx="61" cy="17" rx="2" ry="2.5" fill="#e8a0a0" stroke="none"/>
                <!-- front legs (walking animation) -->
                <line x1="38" y1="46" x2="42" y2="60" stroke="#8c857d" stroke-width="3" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" values="10 38 46; -10 38 46; 10 38 46" dur="0.4s" repeatCount="indefinite"/>
                </line>
                <line x1="46" y1="44" x2="50" y2="58" stroke="#8c857d" stroke-width="3" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" values="-10 46 44; 10 46 44; -10 46 44" dur="0.4s" repeatCount="indefinite"/>
                </line>
                <!-- back legs (walking animation) -->
                <line x1="18" y1="46" x2="14" y2="60" stroke="#8c857d" stroke-width="3" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" values="-10 18 46; 10 18 46; -10 18 46" dur="0.4s" repeatCount="indefinite"/>
                </line>
                <line x1="26" y1="47" x2="22" y2="61" stroke="#8c857d" stroke-width="3" stroke-linecap="round">
                    <animateTransform attributeName="transform" type="rotate" values="10 26 47; -10 26 47; 10 26 47" dur="0.4s" repeatCount="indefinite"/>
                </line>
            </svg>

            <div class="ground"></div>
        </div>

        <h1>Work in Progress</h1>
        <p>This page is still on its way —<br>just like this little guy.</p>
        <a href="index_lastname.html">&larr; Back to Home</a>

    </div>
</body>
</html>
